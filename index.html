<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LedgerTrail - keyboard-driven accounting with a complete Edit Log." />
    <title>LedgerTrail</title>
    <script>
      /* Resolve the saved appearance before the first paint, so the window
         never flashes light while the user is working in dark. */
      (function () {
        try {
          var mode = localStorage.getItem('ledgertrail.theme') || 'system';
          var dark = mode === 'dark'
            || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.density =
            localStorage.getItem('ledgertrail.density') === 'compact' ? 'compact' : 'cosy';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
